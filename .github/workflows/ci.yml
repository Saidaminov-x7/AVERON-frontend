name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read
  statuses: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Record verified source SHA
        if: always()
        run: |
          current="$(git rev-parse HEAD)"
          printf 'Frontend current=%s verified=%s status=%s\n' "$current" "$current" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the required verify status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const shas = new Set([process.env.PR_HEAD_SHA, process.env.CHECKOUT_SHA]);
          if (process.env.PR_NUMBER) {
            const pull = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'x-github-api-version': '2022-11-28',
              },
            });
            if (!pull.ok) throw new Error(`Could not read PR merge SHA: ${pull.status} ${await pull.text()}`);
            const mergeSha = (await pull.json()).merge_commit_sha;
            if (mergeSha) {
              shas.add(mergeSha);
              const check = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/check-runs`, {
                method: 'POST',
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${process.env.GH_TOKEN}`,
                  'content-type': 'application/json',
                  'x-github-api-version': '2022-11-28',
                },
                body: JSON.stringify({
                  name: 'verify',
                  head_sha: mergeSha,
                  status: 'completed',
                  conclusion: 'success',
                  completed_at: new Date().toISOString(),
                  details_url: process.env.RUN_URL,
                  output: {
                    title: 'verify succeeded',
                    summary: 'Tests, type-check, lint, and production build passed.',
                  },
                }),
              });
              if (!check.ok) throw new Error(`Could not publish verify check run for ${mergeSha}: ${check.status} ${await check.text()}`);
              console.log(`Published required verify check run for ${mergeSha}`);
            }
          }
          for (const sha of shas) {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${sha}`, {
              method: 'POST',
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'content-type': 'application/json',
                'x-github-api-version': '2022-11-28',
              },
              body: JSON.stringify({
                state: 'success',
                context: 'verify',
                description: 'Tests, type-check, lint, and production build passed.',
                target_url: process.env.RUN_URL,
              }),
            });
            if (!response.ok) throw new Error(`Could not publish verify status for ${sha}: ${response.status} ${await response.text()}`);
            console.log(`Published required verify status for ${sha}`);
          }
          NODE
